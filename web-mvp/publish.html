<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布问卷 - 问卷互助</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- 顶部导航 -->
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">问卷互助</a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white fw-bold small text-nowrap">当前积分: <span id="top-points" data-points>50</span> 分</span>
                <button type="button" class="btn btn-sm btn-light text-primary text-nowrap"
                        onclick="resetDemoData()">重置演示</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5 pb-5">
        <h4 class="mb-3" id="page-heading">发布问卷</h4>

        <div id="edit-banner" class="alert alert-info d-none" role="status"></div>

        <form id="publish-form" novalidate>
            <!-- 发布者 / 题目数量 / 预计耗时 / 分类：位于表单左上角 -->
            <div class="card border-0 shadow-sm publish-panel mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-6 col-md-3">
                            <label for="publisher" class="form-label small fw-semibold">发布者</label>
                            <input type="text" class="form-control d-none" id="publisher" value="匿名用户" readonly>
                        </div>
                        <div class="col-6 col-md-2">
                            <label for="question-count" class="form-label small fw-semibold">题目数量</label>
                            <input type="number" class="form-control" id="question-count"
                                   min="1" max="10" step="1" value="1" inputmode="numeric">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="minutes" class="form-label small fw-semibold">预计耗时（分钟）</label>
                            <input type="number" class="form-control" id="minutes"
                                   min="1" max="60" step="1" value="3" inputmode="numeric">
                        </div>
                        <div class="col-6 col-md-2">
                            <label for="category" class="form-label small fw-semibold">分类</label>
                            <select class="form-select" id="category"></select>
                        </div>
                    </div>
                    <p class="form-text mt-2 mb-0">发布者按当前用户信息自动填入；数字输入框不接受负数。</p>
                </div>
            </div>

            <!-- 标题、素材、题目与操作区居中 -->
            <div class="publish-column">
                <div class="card border-0 shadow-sm publish-panel mb-3">
                    <div class="card-body">
                        <label for="title" class="form-label fw-semibold">问卷标题</label>
                        <input type="text" class="form-control publish-title-input" id="title"
                               maxlength="20" placeholder="请输入问卷标题（最多 20 字）" autocomplete="off">
                        <div class="text-end small text-muted mt-1"><span id="title-count">0</span>/20</div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm publish-panel mb-3">
                    <div class="card-body">
                        <label for="material" class="form-label fw-semibold">上传素材（封面图，可选）</label>
                        <input type="file" class="form-control" id="material" accept="image/*">
                        <p class="form-text mb-0">支持常见图片格式，大小不超过 2MB；会展示在问卷详情页。</p>
                        <div class="d-none align-items-end gap-2 mt-2" id="material-preview">
                            <img id="material-preview-img" class="publish-material-img" alt="素材预览">
                            <button type="button" class="btn btn-sm btn-outline-danger" id="remove-material">移除素材</button>
                        </div>
                    </div>
                </div>

                <div id="questions" aria-label="题目设置"></div>

                <div class="d-flex align-items-center gap-2 mt-3 mb-4">
                    <button type="button" class="btn btn-outline-primary" id="add-question">＋ 添加题目</button>
                    <span class="small text-muted" id="question-limit-hint">最多 10 道题</span>
                </div>

                <div class="alert alert-danger d-none" id="form-error" role="alert"></div>

                <div class="d-flex gap-2 flex-wrap publish-actions mb-3">
                    <button type="submit" class="btn btn-primary btn-lg flex-grow-1" id="publish-submit">消耗 10 积分发布问卷</button>
                    <button type="button" class="btn btn-outline-secondary btn-lg" id="reset-form">重置</button>
                </div>

                <div class="alert alert-warning d-none" id="points-hint"></div>

                <p class="small text-muted text-center mb-0">
                    发布即锁定：锁定后发布者仍可修改题目，参与填写者无权更改。
                </p>
            </div>
        </form>
    </div>

    <!-- 底部导航 -->
    <nav class="navbar fixed-bottom navbar-light bg-white border-top">
        <div class="container justify-content-around">
            <a class="nav-link text-secondary" href="index.html">首页</a>
            <a class="nav-link text-primary fw-bold" href="publish.html">发布问卷</a>
            <a class="nav-link text-secondary" href="profile.html">我的</a>
        </div>
    </nav>

    <template id="question-template">
        <div class="card border-0 shadow-sm publish-panel mb-3 publish-question-card question-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
                    <h6 class="publish-question-no question-no mb-0">第 1 题</h6>
                    <div class="d-flex align-items-center gap-2">
                        <select class="form-select form-select-sm publish-type-select question-type" aria-label="题型">
                            <option value="single">单选</option>
                            <option value="multiple">多选</option>
                        </select>
                        <button type="button" class="btn btn-sm btn-outline-danger remove-question">删除题目</button>
                    </div>
                </div>
                <label class="form-label small text-muted">题目</label>
                <input type="text" class="form-control question-text" maxlength="100"
                       placeholder="请输入题目内容（最多 100 字）">
                <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
                    <span class="form-label small text-muted mb-0">选项</span>
                    <span class="small text-muted">2-6 个，不能重复</span>
                </div>
                <div class="options"></div>
                <button type="button" class="btn btn-sm btn-link px-0 add-option">＋ 添加选项</button>
                <div class="publish-answer-box mt-2">
                    <label class="form-label small fw-semibold mb-1">正确答案（选填）</label>
                    <input type="text" class="form-control answer-input" maxlength="23"
                           placeholder="如：A（只能填 1 个）">
                    <div class="form-text">按选项字母填写，多选可填多个，如 A,C；提交后展示参考答案。</div>
                </div>
            </div>
        </div>
    </template>

    <template id="option-template">
        <div class="d-flex align-items-center gap-2 mb-2 publish-option-row option-row">
            <span class="publish-option-letter option-letter">A</span>
            <input type="text" class="form-control option-input" maxlength="50" placeholder="请输入选项内容">
            <button type="button" class="btn btn-outline-danger remove-option" aria-label="删除选项">×</button>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/publish.js"></script>
</body>
</html>
