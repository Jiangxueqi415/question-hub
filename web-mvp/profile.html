<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 问卷互助</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <span class="navbar-brand mb-0 h1">问卷互助</span>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white fw-bold small text-nowrap">当前积分: <span id="top-points" data-points>0</span> 分</span>
                <button type="button" class="btn btn-sm btn-light text-primary text-nowrap" onclick="resetDemoData()">重置演示</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5 mt-3">
        <div class="card mb-3">
            <div class="card-body">
                <h4>我的积分：<span id="profile-points">0</span></h4>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body" id="profile-credit-wrap">
                <h5>我的信誉分：<span id="profile-credit">0</span> <span id="profile-credit-level"></span></h5>
                <div id="profile-credit-bar"></div>
            </div>
        </div>

        <div class="mb-4">
            <h6>信誉变动记录</h6>
            <div id="credit-timeline"></div>
        </div>
        <div class="mb-4">
            <h6>积分变动记录</h6>
            <div id="points-timeline"></div>
        </div>

        <h5 class="mb-2">我发布的问卷</h5>
        <div id="my-surveys" class="mb-5"></div>

        <h5 class="mb-2">我填写过的问卷</h5>
        <div id="my-history"></div>
    </div>

    <nav class="navbar fixed-bottom navbar-light bg-white border-top">
        <div class="container justify-content-around">
            <a class="nav-link text-secondary" href="index.html">首页</a>
            <a class="nav-link text-secondary" href="publish.html">发布问卷</a>
            <a class="nav-link text-primary fw-bold" href="profile.html">我的</a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

<script>
// P‑01修复：textContent防止XSS；P‑02修复：addEventListener代替onclick拼接
function renderMyPublish(){
  const list = window.SurveyStore.mine();
  const box = document.getElementById('my-surveys');
  box.innerHTML = '';
  if(!list || list.length === 0){
    box.innerHTML = '<p class="text-muted">还没有发布过问卷</p>';
    return;
  }
  list.forEach(function(item){
    const row = document.createElement('div');
    row.className = 'd-flex justify-content-between align-items-center border-bottom py-2';

    const titleDom = document.createElement('span');
    titleDom.textContent = item.title;
    row.appendChild(titleDom);

    const actions = document.createElement('div');

    const view = document.createElement('a');
    view.href = 'detail.html?id=' + encodeURIComponent(item.id);
    view.className = 'me-2';
    view.textContent = '查看';
    actions.appendChild(view);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-sm btn-outline-danger';
    delBtn.textContent = '删除';
    delBtn.addEventListener('click',function(){
        delSurvey(item.id);
    })
    actions.appendChild(delBtn);

    row.appendChild(actions);
    box.appendChild(row);
  })
}

// P‑05修复：判断remove返回值，失败弹窗，同时刷新两份列表
function delSurvey(id){
  if(!confirm('确定要删除这份问卷吗？')) return;
  const res = window.SurveyStore.remove(id);
  if(!res){
    alert('删除失败，请重试');
    return;
  }
  renderMyPublish();
  renderMyHistory();
}

// P‑04兼容：有time就展示，没有显示“—”，页面不报错（改数据是app.js同学的工作）
function renderMyHistory(){
  const list = window.SurveyStore.history();
  const box = document.getElementById('my-history');
  box.innerHTML = '';
  if(!list || list.length === 0){
    box.innerHTML = '<p class="text-muted">还没有填写过问卷</p>';
    return;
  }
  list.forEach(function(item){
    const div = document.createElement('div');
    div.className = 'border-bottom py-2';
    const timeStr = item.time ? new Date(item.time).toLocaleString('zh‑CN') : '—';
    if(item.exists){
      div.textContent = `${item.title}（填写获得 ${item.reward} 分）｜填写时间：${timeStr}`;
    }else{
      div.textContent = '问卷已删除';
      div.className += ' text-muted';
    }
    box.appendChild(div);
  })
}

window.addEventListener('load',function(){
    renderMyPublish();
    renderMyHistory();
})

// P‑06修复：storage监听，多标签页同步刷新
window.addEventListener('storage',function(e){
    if(e.key === 'surveys' || e.key === 'claimed'){
        renderMyPublish();
        renderMyHistory();
    }
})
</script>
</body>
</html>
