<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷互助平台 - 首页</title>
    <!-- 引入 Bootstrap 5 的样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入你自己的样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <span class="navbar-brand mb-0 h1">问卷互助</span>
            <div class="d-flex align-items-center gap-2">
                <!-- 这里显示积分（data-points 供 app.js 统一刷新） -->
                <span class="text-white fw-bold small text-nowrap">当前积分: <span id="top-points" data-points>50</span> 分</span>
                <!-- 一键重置：清空 points / claimed 后刷新 -->
                <button type="button" class="btn btn-sm btn-light text-primary text-nowrap"
                        onclick="resetDemoData()">重置演示</button>
            </div>
        </div>
    </nav>

    
	<div class="container pb-5 mt-3">
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="text-muted small">我的积分</div>
                    <h4 class="mb-0"><span id="profile-points">50</span> 分</h4>
                </div>
                <div class="text-end">
                    <div class="text-muted small">信誉分</div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="fs-4 fw-bold" id="profile-credit">0</span>
                        <span class="badge bg-secondary" id="profile-credit-level">较差</span>
                    </div>
                </div>
            </div>
            <div class="progress mt-3" style="height:8px">
                <div class="progress-bar bg-secondary" id="profile-credit-bar" style="width:0%"></div>
            </div>
            <p class="text-muted small mb-0 mt-2">信誉分 ≥40 才能发布问卷；完成他人问卷 +5，新人任务 +40。</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0">信誉分记录</h6>
                <div class="d-flex gap-2">
                    <button id="onboard-btn" type="button" class="btn btn-sm btn-success"
                            onclick="claimOnboard()">新人任务 +40</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="demoBtn" onclick="demoPenalty()">演示：逾期 -20</button>
                </div>
            </div>
            <div id="credit-timeline"></div>
            <hr>
            <h6 class="mb-2">积分记录</h6>
            <div id="points-timeline"></div>
        </div>
    </div>

    <h5 class="mb-2">我发布的问卷</h5>
    <div id="my-surveys" class="mb-5">
    </div>

    <h5 class="mb-2">我填写过的问卷</h5>
    <div id="my-history">
    </div>
</div>

    <!-- 底部导航栏（固定在底部） -->
    <nav class="navbar fixed-bottom navbar-light bg-white border-top">
        <div class="container justify-content-around">
            <a class="nav-link text-secondary" href="index.html">首页</a>
            <a class="nav-link text-secondary" href="publish.html">发布问卷</a>
            <a class="nav-link text-primary fw-bold" href="profile.html">我的</a>
        </div>
    </nav>

    <!-- 引入 Bootstrap 的 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入你自己的 JS -->
    <script src="js/app.js"></script>
	<script>
function renderMyPublish(){
  var list = window.SurveyStore.mine();
  var box = document.getElementById('my-surveys');
  if(list.length === 0){
    box.innerHTML = '<p class="text-muted">还没有发布过问卷</p>';
    return;
  }
  box.innerHTML = '';
  list.forEach(function(item){
    var div = document.createElement('div');
    div.className = 'd-flex justify-content-between align-items-center border-bottom py-2';
    div.innerHTML = `
      <span>${item.title}</span>
      <div>
        <a href="detail.html?id=${item.id}" class="me-2">查看</a>
        <button class="btn btn-sm btn-outline-danger" onclick="delSurvey(${item.id})">删除</button>
      </div>
    `;
    box.appendChild(div);
  })
}
function renderMyHistory(){
  var list = window.SurveyStore.history();
  var box = document.getElementById('my-history');
  if(list.length === 0){
    box.innerHTML = '<p class="text-muted">还没有填写过问卷</p>';
    return;
  }
  box.innerHTML = '';
  list.forEach(function(item){
    var div = document.createElement('div');
    div.className = 'border-bottom py-2';
    if(item.exists){
      div.textContent = item.title + " （填写获得 "+ item.reward +" 分）";
    }else{
      div.textContent = "问卷已删除";
      div.className += " text-muted";
    }
    box.appendChild(div);
  })
}
function delSurvey(id){
  if(confirm('确定要删除这份问卷吗？')){
    window.SurveyStore.remove(id);
    renderMyPublish();
    renderMyHistory();
  }
}
window.addEventListener('load',function(){
  renderMyPublish();
  renderMyHistory();
  var userInfo = window.SurveyStore.getUser();
  document.getElementById('profile-points').innerText = userInfo.score;
})
</script>
    <script>
        // P-08: 如果网址没有 ?demo=1，就隐藏演示按钮
        if (!window.location.search.includes('demo=1')) {
            var dBtn = document.getElementById('demoBtn');
            if (dBtn) {
                dBtn.style.display = 'none';
            }
        }
    </script>
</body>
</html>
