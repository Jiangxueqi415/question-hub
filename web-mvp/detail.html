<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写问卷</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- 返回首页必须是真链接，不能是 href=" "，也不依赖 JS -->
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">⬅ 返回首页</a>
            <span class="text-white fw-bold">当前积分: <span id="top-points" data-points>0</span> 分</span>
        </div>
    </nav>

    <div class="container mt-4 mb-5 pb-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <!-- 标题和题目由 app.js 按 URL 中的 id 渲染 -->
                <h4 class="card-title text-primary" id="q-title">问卷详情</h4>
                <p class="text-muted small mb-3" id="q-meta"></p>
                <div class="small text-muted mb-3 d-none" id="answer-timer">
                    ⏱️ 正在记录作答时间：<span id="timer-display" class="fw-bold text-danger">0</span> 秒
                </div>
                <hr>
                <div id="q-body"></div>

                <!-- 核心按钮：未答完为灰色不可点，答完后由 app.js 变绿启用 -->
                <button id="claim-btn" class="btn btn-secondary w-100 py-2 mt-2" onclick="claimPoints()" disabled>请先答完题目</button>
                <div id="tip" class="text-success text-center mt-2 fw-bold" style="display: none;">完成奖励：积分 +5、信誉分 +5</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stats.js"></script>
    <!-- 注意：这里引入了 app.js -->
    <script src="js/app.js"></script>
</body>
</html>
