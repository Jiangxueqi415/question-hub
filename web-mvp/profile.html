<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 问卷互助</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">问卷互助</a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white fw-bold small text-nowrap">当前积分: <span id="top-points" data-points>0</span> 分</span>
                <button type="button" class="btn btn-sm btn-light text-primary text-nowrap"
                        onclick="resetDemoData()">重置演示</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5 mt-3">
        <h4 class="mb-3">我的</h4>

        <!-- 积分 / 信誉分总览：数值由 app.js 统一刷新 -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-4 align-items-center">
                    <div class="col-6">
                        <div class="text-muted small">我的积分</div>
                        <div class="d-flex align-items-end gap-1">
                            <span class="display-5 fw-bold text-primary lh-1" id="profile-points" data-points>0</span>
                            <span class="text-muted small mb-1">分</span>
                        </div>
                        <p class="text-muted small mb-0 mt-2">完成问卷 +5 · 发布问卷 -10</p>
                    </div>
                    <div class="col-6">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="text-muted small">我的信誉分</div>
                            <span class="badge bg-secondary" id="profile-credit-level">较差</span>
                        </div>
                        <div class="d-flex align-items-end gap-1">
                            <span class="display-5 fw-bold lh-1" id="profile-credit" data-credit>0</span>
                            <span class="text-muted small mb-1">/100</span>
                        </div>
                        <div class="progress mt-2" style="height:6px" role="progressbar"
                             aria-label="信誉分" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                            <div class="progress-bar bg-secondary" id="profile-credit-bar" style="width:0%"></div>
                        </div>
                        <p class="text-muted small mb-0 mt-2">完成问卷 +5 · 发布需 ≥ 40</p>
                    </div>
                </div>
                <p class="text-muted small mb-0 mt-3">
                    发布问卷需同时满足：积分 ≥ 10、信誉分 ≥ 40；逾期未在截止时间内完成作答扣 20 信誉分（不扣积分）。
                </p>
            </div>
        </div>

        <!-- 信誉分 / 积分流水 -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h6 class="mb-0">积分与信誉分记录</h6>
                    <div class="d-flex gap-2">
                        <button id="onboard-btn" type="button" class="btn btn-sm btn-success"
                                onclick="claimOnboard()">新人任务 +40</button>
                        <button id="demo-btn" type="button" class="btn btn-sm btn-outline-danger d-none"
                                onclick="demoPenalty()">演示：逾期 -20</button>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="text-muted small mb-1">信誉分记录</div>
                        <div id="credit-timeline"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small mb-1">积分记录</div>
                        <div id="points-timeline"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 我发布的问卷：发布者统计（与详情页同一套条状图） -->
        <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
            <h5 class="mb-0">我发布的问卷</h5>
            <span class="small text-muted" id="my-publish-summary"></span>
        </div>
        <div id="my-surveys" class="mb-4"></div>

        <!-- 我填写过的问卷：按领取顺序整理 -->
        <h5 class="mb-2">我填写过的问卷</h5>
        <div id="my-history" class="mb-4"></div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="navbar fixed-bottom navbar-light bg-white border-top">
        <div class="container justify-content-around">
            <a class="nav-link text-secondary" href="index.html">首页</a>
            <a class="nav-link text-secondary" href="publish.html">发布问卷</a>
            <a class="nav-link text-primary fw-bold" href="profile.html">我的</a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
