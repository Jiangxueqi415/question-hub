spring.application.name=hudayouju

# 1. 允许局域网访问
server.address=0.0.0.0

# 2. 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/hudayouju_db?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true