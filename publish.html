<!-- 视觉呈现：顶部导航 + 居中表单卡片 + 底部导航。
• 页面元素：
	• 表单内容：
		• 问卷标题（<input>，必填）。
		• 题目输入框（固定放 3 个 <input> 即可）。
		• 视觉效果（可选）：一个“+ 添加题目”按钮，点击后原生 JS 动态增加一行输入框。
	• 提交按钮：红色或绿色大按钮，文字：消耗 10 积分发布问卷。
• 交互逻辑：
	• 点击发布：判断当前积分是否 ≥ 10。如果不足，弹窗提示“积分不足”。
	• 如果充足：积分 -10，存入 localStorage。
	• 弹窗提示“发布成功！”。
	• 跳转回 index.html。（注：首页不用真的新增数据，录制视频时靠剪辑或口头说明即可，或者提前在首页写死一条假的新问卷）。 -->
