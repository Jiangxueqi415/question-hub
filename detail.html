<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写问卷</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href=" ">⬅ 返回首页</a >
            <span class="text-white fw-bold">当前积分: <span id="top-points">50</span> 分</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title text-primary">问卷详情</h4>
                <p class="text-muted">这里模拟问卷的填写界面...</p >
                <hr>
                <!-- 核心按钮 -->
                <button id="claim-btn" class="btn btn-success w-100 py-2" onclick="claimPoints()">提交问卷并领取积分</button>
                <div id="tip" class="text-success text-center mt-2 fw-bold" style="display: none;">积分 +5 成功！</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 注意：这里引入了 app.js -->
    <script src="js/app.js"></script>
</body>
</html>
